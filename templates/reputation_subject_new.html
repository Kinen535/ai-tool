{% extends "base.html" %}

{% block content %}

<div style="max-width:1200px;margin:0 auto;padding:28px 24px 80px;">

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
        <h1 style="font-size:42px;margin:0;">👤 新增信誉主体</h1>

        <div style="display:flex;gap:12px;align-items:center;">
            <a href="/reputation/subjects"
               style="background:#eff6ff;color:#2563eb;padding:10px 16px;border-radius:12px;text-decoration:none;font-weight:bold;">
                返回主体列表
            </a>

            <a href="/reputation/search"
               style="background:#f8fafc;color:#334155;padding:10px 16px;border-radius:12px;text-decoration:none;font-weight:bold;">
                信誉检索
            </a>
        </div>
    </div>

    {% if request.args.get('error') == 'missing' %}
    <div style="background:#fff7ed;border:1px solid #fed7aa;color:#f97316;border-radius:14px;padding:14px 18px;margin-bottom:18px;font-weight:bold;">
        ⚠️ 显示名称和游戏编号至少填写一个。
    </div>
    {% endif %}

    <div style="background:#fef2f2;border-left:6px solid #dc2626;border-radius:20px;padding:28px;max-width:900px;">
        <h2 style="margin-top:0;">① 主体资料</h2>

        <form method="POST" action="/reputation/subjects/new">

            <label style="font-weight:bold;">主体类型</label>
            <select name="subject_type"
                    style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:8px 0 16px 0;">
                <option value="player">玩家</option>
                <option value="account">账号</option>
                <option value="alliance">同盟</option>
                <option value="group">团体</option>
                <option value="other">其他</option>
            </select>

            <label style="font-weight:bold;">显示名称</label>
            <input name="display_name"
                   placeholder="例如：山河白酒"
                   style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:8px 0 16px 0;">

            <label style="font-weight:bold;">游戏编号</label>
            <input name="game_id"
                   placeholder="例如：31475391"
                   style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:8px 0 16px 0;">

            <label style="font-weight:bold;">曾用名</label>
            <input name="alias_names"
                   placeholder="多个曾用名用逗号分隔"
                   style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:8px 0 16px 0;">

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div>
                    <label style="font-weight:bold;">信任等级</label>
                    <select name="trust_level"
                            style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:8px 0 16px 0;">
                        <option value="unknown">未知</option>
                        <option value="trusted">可信</option>
                        <option value="risky">存疑</option>
                        <option value="black">黑名单</option>
                    </select>
                </div>

                <div>
                    <label style="font-weight:bold;">风险等级</label>
                    <select name="risk_level"
                            style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:8px 0 16px 0;">
                        <option value="normal">正常</option>
                        <option value="warning">预警</option>
                        <option value="danger">危险</option>
                        <option value="black">黑</option>
                    </select>
                </div>
            </div>

            <label style="font-weight:bold;">状态</label>
            <select name="status"
                    style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:8px 0 16px 0;">
                <option value="active">生效</option>
                <option value="inactive">停用</option>
            </select>

            <label style="font-weight:bold;">来源</label>
            <input name="source"
                   value="manual"
                   placeholder="例如：manual / 截图记录 / 盟内反馈"
                   style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:8px 0 16px 0;">

            <label style="font-weight:bold;">备注</label>
            <textarea name="note"
                      rows="5"
                      placeholder="记录原因、来源、背景，不建议写无证据的定性辱骂。"
                      style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:8px 0 22px 0;"></textarea>

            <div style="display:flex;gap:12px;">
                <button type="submit"
                        style="background:#2563eb;color:white;border:0;border-radius:10px;padding:12px 20px;font-weight:bold;">
                    保存主体
                </button>

                <a href="/reputation/subjects"
                   style="background:#f1f5f9;color:#475569;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:bold;">
                    取消
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
